# Atualizações automáticas de dependências (PRs semanais) e alertas de segurança.
version: 2
updates:
  - package-ecosystem: pip
    directory: /collector
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/collector", "/api", "/web"]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
