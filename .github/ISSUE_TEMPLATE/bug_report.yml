name: Bug report
description: Something on the site or in the code is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security or privacy problems, do not use this form: see SECURITY.md.
        To remove your character from the site, use the opt-out page instead.
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://.../en/world/Antica
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: ["Desktop", "Tablet", "Phone", "Not device-related"]
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome, Firefox, Safari (iOS)...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra details
