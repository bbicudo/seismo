name: Feature request
description: Suggest an idea for Seismo
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe the idea and what it would help players do.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Where would the data come from?
      description: A TibiaData endpoint, a tibia.com page, TibiaWiki... Leave it blank if you are not sure.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This idea does not track or expose specific players beyond what the site already shows.
